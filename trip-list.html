<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Travel Planner — Trips</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F3EC; --surface:#FFFFFF; --ink:#232323; --muted:#6B6455;
    --border:#E4DFD3; --accent:#146B5E; --accent-hover:#0F5147; --accent-soft:#E7F1EE;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh}
  .ref-banner{background:#1F1B14;color:#D8D2C2;font-size:12px;letter-spacing:.06em;text-transform:uppercase;
    padding:8px 20px;display:flex;justify-content:space-between}
  .ref-banner a{color:#D8D2C2;text-decoration:underline}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:24px 40px;
    border-bottom:1px solid var(--border);background:var(--surface)}
  .logo{font-family:'Fraunces',serif;font-weight:600;font-size:20px}
  .btn{height:40px;padding:0 18px;border-radius:10px;border:none;font-weight:600;font-size:14px;cursor:pointer}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:var(--accent-hover)}
  .content{max-width:820px;margin:0 auto;padding:36px 24px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
  .trip-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;cursor:pointer}
  .trip-card:hover{border-color:var(--accent)}
  .thumb{height:110px;background:linear-gradient(135deg,var(--accent-soft),#D8EAE4)}
  .trip-body{padding:16px 18px}
  .trip-title{font-family:'Fraunces',serif;font-weight:600;font-size:18px;margin-bottom:2px}
  .trip-dates{color:var(--muted);font-size:13px;margin-bottom:12px}
  .members{display:flex;align-items:center}
  .avatar{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;
    font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;
    border:2px solid var(--surface);margin-left:-8px}
  .avatar:first-child{margin-left:0}
  .avatar.alt{background:#B0765A}
  .avatar.alt2{background:#5A7EB0}
</style>
</head>
<body>
  <div class="ref-banner"><span>Reference — Trip list</span><a href="workflow.html">← workflow 전체 보기</a></div>
  <div class="topbar">
    <div class="logo">Travel Planner</div>
    <button class="btn btn-primary" onclick="alert('여행 생성 폼 (Trip 생성)')">+ New trip</button>
  </div>
  <div class="content">
    <div class="grid">
      <div class="trip-card" onclick="location.href='trip-detail.html'">
        <div class="thumb"></div>
        <div class="trip-body">
          <div class="trip-title">Japan</div>
          <div class="trip-dates">Aug 1 – Aug 7</div>
          <div class="members">
            <div class="avatar">J</div>
            <div class="avatar alt">M</div>
            <div class="avatar alt2">K</div>
          </div>
        </div>
      </div>
      <div class="trip-card" onclick="location.href='trip-detail.html'">
        <div class="thumb"></div>
        <div class="trip-body">
          <div class="trip-title">Korea</div>
          <div class="trip-dates">Sep 10 – Sep 15</div>
          <div class="members">
            <div class="avatar">J</div>
            <div class="avatar alt">M</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
