<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Travel Planner — Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F3EC; --surface:#FFFFFF; --ink:#232323; --muted:#6B6455;
    --border:#E4DFD3; --accent:#146B5E; --accent-hover:#0F5147; --accent-soft:#E7F1EE;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh}
  .ref-banner{background:#1F1B14;color:#D8D2C2;font-size:12px;letter-spacing:.06em;text-transform:uppercase;
    padding:8px 20px;display:flex;justify-content:space-between}
  .ref-banner a{color:#D8D2C2;text-decoration:underline}
  .wrap{min-height:calc(100vh - 36px);display:flex;align-items:center;justify-content:center;padding:40px 20px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:36px 40px;width:100%;max-width:420px}
  .back{font-size:13px;color:var(--muted);text-decoration:none;display:inline-block;margin-bottom:14px}
  .title{font-family:'Fraunces',serif;font-weight:600;font-size:22px;margin-bottom:24px}
  label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}
  .field{margin-bottom:16px}
  .row{display:flex;gap:12px}
  .row .field{flex:1}
  input,textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:0 14px;
    font-family:'Inter',sans-serif;font-size:14px;background:#FCFBF8}
  input{height:44px}
  textarea{padding:10px 14px;height:70px;resize:none}
  input:focus,textarea:focus{outline:none;border-color:var(--accent)}
  .actions{display:flex;gap:10px;margin-top:8px}
  .btn{height:44px;flex:1;border-radius:10px;border:none;font-weight:600;font-size:14px;cursor:pointer}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:var(--accent-hover)}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--ink)}
  .btn-ghost:hover{background:var(--accent-soft)}
</style>
</head>
<body>
  <div class="ref-banner"><span>Reference — Add/edit schedule</span><a href="workflow.html">← workflow 전체 보기</a></div>
  <div class="wrap">
    <div class="card">
      <a class="back" href="trip-detail.html">← Trip detail</a>
      <div class="title">Add schedule</div>
      <div class="field"><label>Title</label><input type="text" placeholder="예: Senso-ji temple"></div>
      <div class="row">
        <div class="field"><label>Date</label><input type="text" placeholder="Aug 2"></div>
        <div class="field"><label>Time</label><input type="text" placeholder="10:00"></div>
      </div>
      <div class="field"><label>Location</label><input type="text" placeholder="Asakusa, Tokyo"></div>
      <div class="field"><label>Memo</label><textarea placeholder="메모 (선택)"></textarea></div>
      <div class="actions">
        <button class="btn btn-ghost" onclick="location.href='trip-detail.html'">Cancel</button>
        <button class="btn btn-primary" onclick="location.href='trip-detail.html'">Save</button>
      </div>
    </div>
  </div>
</body>
</html>
